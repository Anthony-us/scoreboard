        <div class="container">
            <div>
                <h3>HOME</h3>
                <div>

                </div>

                </div>
            </div>
            <div>
                <h3>AWAY</h3>
                <div>
                    <span id="guessCounter"></span>
                <div class="score-points">
                    <p class="box" onclick="addOneG()">+ 1</p>
                    <p class="box" onclick="addTwoG()">+ 2</p>
                    <p class="box" onclick="addThreeG()">+ 3</p>
                </div>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
